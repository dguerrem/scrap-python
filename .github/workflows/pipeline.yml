name: "🚀 Pipeline de Leads"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scraper | enricher | pipeline"
        required: true
        default: "pipeline"
        type: choice
        options:
          - pipeline
          - scraper
          - enricher
      profile_json:
        description: "Perfil de scrap (JSON)"
        required: true
        type: string
      cities:
        description: "Ciudades separadas por coma (vacío = las del perfil)"
        required: false
        default: ""
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Prepare data directory & profile
        env:
          PROFILE_JSON: ${{ inputs.profile_json }}
        run: |
          mkdir -p data/runs
          python -c "
          import os, json
          p = json.loads(os.environ['PROFILE_JSON'])
          with open('data/active_profile.json', 'w') as f:
              json.dump(p, f, ensure_ascii=False)
          print('Profile:', p.get('nombre', '?'))
          "

      - name: Run pipeline
        run: |
          MODE="${{ inputs.mode }}"
          CITIES="${{ inputs.cities }}"
          CITIES_ARG=""
          if [ -n "$CITIES" ]; then
            CITIES_ARG="--cities $CITIES"
          fi

          if [ "$MODE" = "scraper" ]; then
            python run_scraper.py --headless --profile data/active_profile.json $CITIES_ARG
          elif [ "$MODE" = "enricher" ]; then
            python run_enricher.py --headless --run-id ci-run
          else
            python run_pipeline.py --headless --profile data/active_profile.json $CITIES_ARG
          fi

      - name: Auto-import leads to Turso
        id: import
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          # Leer perfil para saber si auto_import está activo
          profile_path = Path('data/active_profile.json')
          profile = {}
          if profile_path.exists():
              profile = json.loads(profile_path.read_text())

          auto_import = profile.get('auto_import', 1)
          nombre = profile.get('nombre', 'Manual')

          # Los artifacts de un repo público los descarga cualquiera. Sólo se
          # suben cuando son la única copia de los datos (ver RIESGO-B).
          upload = 'no'

          try:
              if not auto_import:
                  print(f'Auto-import desactivado para perfil: {nombre}')
                  print('Los leads quedan como artifacts para importar manualmente.')
                  upload = 'yes'
              else:
                  from src.crm.db import import_from_json
                  enriched = Path('data/leads_enriched.json')
                  raw = Path('data/leads_raw.json')
                  if enriched.exists():
                      n = import_from_json(enriched, perfil_origen=nombre)
                      print(f'Imported {n} enriched leads to Turso (perfil: {nombre})')
                  elif raw.exists():
                      n = import_from_json(raw, perfil_origen=nombre)
                      print(f'Imported {n} raw leads to Turso (perfil: {nombre})')
                  else:
                      print('No lead files found to import')
          except Exception as e:
              print(f'ERROR importando a Turso: {type(e).__name__}: {e}')
              print('Se subiran artifacts como copia de seguridad.')
              upload = 'yes'

          if upload == 'yes':
              print('::warning::Se van a publicar artifacts con datos de contacto. '
                    'Descargalos e importalos, y borra el artifact al terminar.')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'upload={upload}\n')
          EOF

      # Sólo si los datos NO han llegado a Turso. En la ruta normal la copia
      # vive en la base de datos y no hace falta publicar nada.
      - name: Upload artifacts (solo si no se importaron)
        if: always() && steps.import.outputs.upload == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: |
            data/leads_raw.json
            data/leads_raw.csv
            data/leads_enriched.json
            data/leads_enriched.csv
            data/runs/
          if-no-files-found: ignore
          retention-days: 1
